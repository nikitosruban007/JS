<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація у ТЦК</title>
    <link rel="stylesheet" href="style/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="wrapper">
    <header>
        <h1>Реєстрація у системі ТЦК</h1>
    </header>
    <main>
        <form id="register">
            <label>
                Логін
                <input name="login" type="text" placeholder="mykola.petrenko" required>
            </label>

            <label>
                Пошта
                <input name="email" type="text" placeholder="mykola.petrenko@email.com" required>
            </label>

            <label>
                Пароль
                <input name="password" type="password" placeholder="password123" required>
            </label>

            <label>
                Ще раз пароль
                <input name="again-password" type="password" placeholder="password123" required>
            </label>
            <button type="submit">Зареєструватися</button>
        </form>
        <a href="index.html">Є акаунт?</a>
    </main>
    <footer></footer>
    <script src="script/script.js"></script>
</div>
</body>
</html>
