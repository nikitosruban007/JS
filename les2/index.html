<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header>
    <h1>Калькулятор нового покоління</h1>
</header>
<main class="wrapper">
    <label>
        <input type="text" id="display">
    </label>
    <div class="buttons">
        <div class="buttons-group">
            <button onclick="calculatePercentage()">%</button>
            <button onclick="clearDisplay()">CE</button>
            <button onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">⌫</button>
        </div>
        <div class="buttons-group">
            <button onclick="oneDividedByI()">¹/x</button>
            <button onclick="getSquare()">x²</button>
            <button onclick="getSquareRoot()">²√x</button>
            <button onclick="appendValue('/')">÷</button>
        </div>
        <div class="buttons-group">
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')">×</button>
        </div>
        <div class="buttons-group">
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')">-</button>
        </div>
        <div class="buttons-group">
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')">+</button>
        </div>
        <div class="buttons-group">
            <button onclick="plusMinus()">+/-</button>
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="calculate()">=</button>
        </div>
    </div>
</main>
<script src="script/script.js"></script>
</body>
</html>
